# Required by every AndroidX dependency, and the build says so plainly rather
# than failing at runtime — which is the alternative and much later.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# Pinned, because Kotlin's compiler does not support every JDK the machine
# might default to — and the failure it produces is "Daemon compilation
# failed: null", which says nothing about the cause.
# Left commented: the path is per-machine. Set it, or export JAVA_HOME, if
# your default JDK is one Kotlin's compiler does not support.
#org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
