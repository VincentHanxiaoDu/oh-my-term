<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the key bar can sit above the home indicator
         rather than behind it; the safe-area insets below do the rest. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101010" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>omt</title>
    <style>
      :root {
        --bg: #101010;
        --fg: #e0e0e0;
        --dim: #808080;
        --blocked: #ffb454;
        --working: #59a5ff;
        --idle: #4a4a4a;
        --done: #6cc070;
        --omt-bg: var(--bg);
        --omt-fg: var(--fg);
        color-scheme: dark light;

        /* The ANSI palette. The instance sends indexed colours as
           var(--omt-ansi-N) rather than as resolved hex, because the index is
           what the program meant and the palette is what the user chose — a
           theme that cannot restyle "red" is not a theme. */
        --omt-ansi-0: #101010; --omt-ansi-1: #e05252; --omt-ansi-2: #6cc070;
        --omt-ansi-3: #d7ba7d; --omt-ansi-4: #59a5ff; --omt-ansi-5: #c586c0;
        --omt-ansi-6: #4ec9b0; --omt-ansi-7: #d0d0d0; --omt-ansi-8: #6a6a6a;
        --omt-ansi-9: #ff7b72; --omt-ansi-10: #8ade94; --omt-ansi-11: #ffd479;
        --omt-ansi-12: #8ab4ff; --omt-ansi-13: #dda0dd; --omt-ansi-14: #7fdbca;
        --omt-ansi-15: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #fbfbfb; --fg: #1a1a1a; --dim: #6a6a6a; --idle: #cfcfcf; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        /* Respect the notch and the home indicator on every edge. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-text-size-adjust: 100%;
      }
      #app { max-width: 720px; margin: 0 auto; padding: 12px; }
      .terminal {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        white-space: pre;
        /* Wide output scrolls inside its own box rather than making the page
           scroll sideways. */
        overflow-x: auto;
        /* Every line is a row of the grid, so a line with no content still
           occupies one — otherwise a blank line collapses and everything below
           it moves up by one row from where the terminal has it. */
        line-height: 1.2;
      }
      .terminal .line { position: relative; min-height: 1.2em; }
      .terminal .cursor {
        position: absolute;
        top: 0;
        width: 1ch;
        height: 1.2em;
        background: var(--fg);
        /* Blended rather than solid: a solid block hides the character under
           the cursor, which is the one character being typed. */
        mix-blend-mode: difference;
      }
      .keybar {
        position: fixed;
        left: 0; right: 0;
        bottom: env(safe-area-inset-bottom);
        display: flex;
        gap: 4px;
        padding: 6px;
        overflow-x: auto;
        background: var(--bg);
        border-top: 1px solid var(--idle);
      }
      .keybar button {
        /* 44pt is Apple's minimum target; anything smaller is a mis-tap. */
        min-width: 44px;
        min-height: 44px;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--idle);
        border-radius: 8px;
      }
      .cell { display: inline-block; width: 1.6em; text-align: center; }
      .cell.blocked { color: var(--blocked); }
      .cell.working { color: var(--working); }
      .cell.idle { color: var(--dim); }
      .cell.finished { color: var(--done); }
      .noscript { padding: 24px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p class="noscript">omt's client needs JavaScript to talk to your instance.</p>
    </noscript>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
