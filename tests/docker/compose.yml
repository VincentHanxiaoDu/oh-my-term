# The SSH fixture. `docker compose up -d` and the tests have a real remote host.
services:
  remote:
    build: .
    container_name: omt-test-remote
    ports:
      - "127.0.0.1:2222:22"
    environment:
      # Passed rather than mounted: a bind-mounted authorized_keys carries the
      # host's uid, and sshd refuses it with "bad ownership or modes" — which
      # passes locally whenever the host uid happens to match and fails
      # everywhere else. The entrypoint writes it with the right owner.
      OMT_TEST_PUBKEY: ${OMT_TEST_PUBKEY:?run tests/docker/setup.sh, or export it}
    # Bound to loopback only: a test fixture that listens on every interface is
    # a test fixture somebody eventually finds.
    restart: "no"
